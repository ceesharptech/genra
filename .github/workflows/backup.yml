name: Scheduled Database Backup

on:
  schedule:
    # Runs weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target database environment (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  backup:
    name: Database Dump & Encrypt
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg

      - name: Dump Database
        env:
          ENV_TARGET: ${{ inputs.environment || 'dev' }}
          DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
          DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          if [ "$ENV_TARGET" = "prod" ]; then
            DB_URL="$DB_URL_PROD"
          else
            DB_URL="$DB_URL_DEV"
          fi

          if [ -z "$DB_URL" ]; then
            echo "::error::Database connection URL for '$ENV_TARGET' is not configured. Check SUPABASE_DB_URL_DEV or SUPABASE_DB_URL_PROD secret."
            exit 1
          fi

          # Direct connection check: Supabase Free direct connection is IPv6 only and fails on IPv4 GitHub Actions runners
          if echo "$DB_URL" | grep -q -E 'db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::Direct database connections (db.<ref>.supabase.co) are IPv6-only on Supabase Free and fail on GitHub Actions runners. You MUST use the IPv4-compatible session pooler connection string (e.g. postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres)."
            exit 1
          fi

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "Dumping public schema for $ENV_TARGET at $TIMESTAMP via session pooler..."
          pg_dump "$DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            -f "genra_backup_${ENV_TARGET}_${TIMESTAMP}.sql"

          echo "DUMP_FILE=genra_backup_${ENV_TARGET}_${TIMESTAMP}.sql" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "ENV_TARGET=$ENV_TARGET" >> $GITHUB_ENV

      - name: Encrypt Backup Artifact
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set. Encrypted backup cannot be produced."
            exit 1
          fi

          gpg --symmetric \
            --cipher-algo AES256 \
            --batch \
            --passphrase "$PASSPHRASE" \
            -o "${DUMP_FILE}.gpg" \
            "$DUMP_FILE"

          # Remove unencrypted plain SQL dump immediately
          rm -f "$DUMP_FILE"
          echo "Backup encrypted to ${DUMP_FILE}.gpg"

      - name: Upload Encrypted Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.ENV_TARGET }}-${{ env.TIMESTAMP }}.gpg
          path: ${{ env.DUMP_FILE }}.gpg
          retention-days: 30
